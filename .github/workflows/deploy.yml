name: Publicar imagen y desplegar en Render

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hola-mundo-devops-produccion
  cancel-in-progress: false

env:
  IMAGE_NAME: docker.io/devstevenf/hola-mundo-devops

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v3
        with:
          username: devstevenf
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir y publicar la imagen
        id: publish
        shell: bash
        run: |
          commit_tag="sha-${GITHUB_SHA:0:12}"
          date_tag="$(date -u +%Y%m%d)"

          docker build \
            --tag "${IMAGE_NAME}:latest" \
            --tag "${IMAGE_NAME}:${commit_tag}" \
            --tag "${IMAGE_NAME}:${date_tag}" \
            .

          docker push "${IMAGE_NAME}:${commit_tag}"
          docker push "${IMAGE_NAME}:${date_tag}"
          docker push "${IMAGE_NAME}:latest"

          echo "image_url=${IMAGE_NAME}:${commit_tag}" >> "$GITHUB_OUTPUT"

      - name: Desplegar en Render y verificar el resultado
        shell: bash
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          DEPLOY_IMAGE: ${{ steps.publish.outputs.image_url }}
        run: |
          deploys_url="https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys"
          body="$(jq -n --arg imageUrl "$DEPLOY_IMAGE" '{imageUrl: $imageUrl}')"

          response="$(curl --fail-with-body --silent --show-error --max-time 30 \
            --request POST "$deploys_url" \
            --header "Authorization: Bearer $RENDER_API_KEY" \
            --header "Content-Type: application/json" \
            --data "$body")"

          deploy_id="$(jq -er '.id' <<< "$response")"

          for attempt in {1..60}; do
            response="$(curl --fail-with-body --silent --show-error --max-time 30 \
              --header "Authorization: Bearer $RENDER_API_KEY" \
              "${deploys_url}/${deploy_id}")"

            status="$(jq -er '.status' <<< "$response")"
            echo "Intento ${attempt}/60. Estado en Render: $status"

            case "$status" in
              live)
                exit 0
                ;;
              build_failed|update_failed|pre_deploy_failed|canceled|deactivated)
                exit 1
                ;;
            esac

            sleep 10
          done

          echo "Render no confirmó el despliegue dentro del tiempo de espera."
          exit 1